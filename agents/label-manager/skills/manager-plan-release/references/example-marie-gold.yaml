songs:
  - title: banale baddie
    isrc: CAEHU2600001
    duration_seconds: 175
    genre: Folk
    language: French
    lyrics: |
      J'pensais être baddie
      Mais je suis que banale
      C'est même pas si facile
      D'avoir une vie normale


      Trouver un emploi
      Une paie à chaque mois
      Avoir des assurances
      Pour en gagner un peu
      Se dire qu'avec le temps
      Enfin tout ira mieux
      Pour quand quitteront nos parents
      Comme on en a que deux


      J'pensais être baddie
      Mais je suis que banale


      Trouver un amoureux
      Enfin quelqu'un de fiable
      Pour partager des voeux
      De Paris à Montréal
      Vouloir des enfants
      Pour leur chanter un peu
      Une brise dans le vent
      Où enfin être heureux
      Et comme je vois le temps
      Me file entre les doigts
      J'ai fait tous mes devoirs
      Mais pas toujours ce qu'il se doit
      Et j'demande pas grand chose
      Que les étoiles comme toit
      Un peu d'argent, être au chaud
      Et moins dans tous mes états
      J'pensais être baddie
      Mais je suis que banale
      C'est même pas si facile
      D'avoir une vie normale

