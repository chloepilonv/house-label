# The Budget sheet: one object per row, keyed like the template's columns
# (BUDGET_TABS in engine/google/budget-sheet.ts).
budget:
  expected:
    - { release: "Projet de guitare abandonné", step: "Presskit and press release finished", department: "Presskit", floor: "$0 CAD", aim: "$0 CAD", full: "$0 CAD", basis: "the label's own presskit desk builds it — Google Slides and a PDF, no vendor", sources: "release-path" }
    - { release: "Projet de guitare abandonné", step: "Radio serviced", department: "Promotion", floor: "$28 CAD", aim: "$300 CAD", full: "$300 CAD + $295 USD", basis: "4 songs: !earshot at $7 a song to campus and community radio is the floor; 45tours.ca is how francophone radio receives a release and is the decent run; a commercial format through Yangaroo ($295 USD, reported apart) is the full one. Delivery buys no airplay", sources: "earshot-cost · 45tours · yangaroo-pricing" }
    - { release: "Projet de guitare abandonné", step: "Press and media pitched", department: "Press Agent", floor: "$0 CAD", aim: "$0 CAD", full: "$0 CAD", basis: "drafted and tracked by the label's publicist desk; an outside publicist is four figures and no independent benchmark exists, so no number is printed for one", sources: "marketing-playbook · release-path" }
    - { release: "Projet de guitare abandonné", step: "Distributor chosen", department: "Distribution", floor: "$19 USD", aim: "$24.99 USD", full: "$24.99 USD", basis: "the two cheapest flat subscriptions our distribution desk holds, per year, 0% cut. Per-release and percentage models cost differently over your own revenue — Distribution ranks them; this is only the range", sources: "distribution-how · distrokid-pricing" }
    - { release: "Projet de guitare abandonné", step: "Editorial pitch sent to Spotify", department: "Promotion", floor: "$0 CAD", aim: "$0 CAD", full: "$0 CAD", basis: "the editorial pitch is filed from Spotify for Artists at no charge; nothing sold anywhere replaces it", sources: "spotify-pitch" }
    - { release: "Projet de guitare abandonné", step: "Marketing campaign starts", department: "Marketing", floor: "$0 CAD", aim: "$210 CAD", full: "$670 CAD", basis: "42 days from campaign start to two weeks after release: organic only is the floor (Meta publishes no minimum); Meta at $5 a day across the window is the decent run; $10 a day plus Spotify Ads Manager's $250 minimum is the full one. Marketing sizes the real split", sources: "meta-ads-minimum · marketing-paid · spotify-ads-ca · marketing-playbook" }
    - { release: "Projet de guitare abandonné", step: "Independent playlist curators pitched", department: "Promotion", floor: "$35 USD", aim: "$150 USD", full: "$280 USD", basis: "SubmitHub credits at the vendor's $1 each, 1–4 credits a submission: 35 credits is our floor (about 10–35 pitches), 150 our decent run — the quantities are our defaults, the price is theirs. The full run is PlaylistPush's published campaign minimum. A paid submission buys a listen, never a placement", sources: "submithub-pricing · playlistpush-pricing" }
    - { release: "Projet de guitare abandonné", step: "Total", floor: "$28 CAD + $54 USD", aim: "$510 CAD + $174.99 USD", full: "$970 CAD + $599.99 USD" }
    - { release: "Projet de guitare abandonné", step: "Your budget", floor: "$745 CAD" }
